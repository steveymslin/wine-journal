<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wine Journal">
<title>Wine Journal</title>
<style>
:root {
  --bg:      #0A1628;
  --surface: #112240;
  --card:    #1A3358;
  --border:  #1E3D6B;
  --accent:  #4A9EFF;
  --accent2: #2979D4;
  --white:   #FFFFFF;
  --dim:     #8BAED4;
  --red:     #FF5A5A;
  --green:   #4ECBA3;
  --yellow:  #FFB84A;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.9rem 1rem 0;
  position: sticky; top: 0; z-index: 20;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
.header h1 { font-size: 1.3rem; font-weight: 700; color: var(--white); }
.header-sub { font-size: 0.75rem; color: var(--dim); margin-top: 0.1rem; }
.header-actions { display: flex; gap: 0.5rem; }
.icon-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--dim);
  width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.icon-btn:hover { color: var(--white); border-color: var(--accent); }

.search-wrap { position: relative; margin-bottom: 0.75rem; }
.search-input {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  color: var(--white); padding: 0.55rem 0.8rem 0.55rem 2.2rem;
  font-size: 0.9rem; border-radius: 8px; outline: none; font-family: inherit;
}
.search-input::placeholder { color: var(--dim); }
.search-input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }

.tabs { display: flex; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; padding: 0.55rem 1rem; font-size: 0.82rem; font-weight: 500; color: var(--dim); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.content { padding: 1rem; }

.wine-list { display: flex; flex-direction: column; gap: 0.5rem; }
.wine-row {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.75rem; display: flex; align-items: center; gap: 0.75rem; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.wine-row:hover { border-color: var(--accent); background: var(--card); }
.row-thumb { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
.row-thumb-ph { width: 46px; height: 46px; border-radius: 6px; flex-shrink: 0; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
.row-info { flex: 1; min-width: 0; }
.row-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { font-size: 0.78rem; color: var(--dim); margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-right { text-align: right; flex-shrink: 0; }
.row-vintage { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
.row-score { font-size: 0.72rem; color: var(--yellow); margin-top: 0.2rem; }
.row-price { font-size: 0.72rem; color: var(--green); margin-top: 0.1rem; }

.wine-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
.wine-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color 0.15s; }
.wine-card:hover { border-color: var(--accent); }
.card-img { width: 100%; height: 110px; object-fit: cover; display: block; }
.card-img-ph { width: 100%; height: 70px; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
.card-body { padding: 0.6rem; }
.card-name { font-weight: 600; font-size: 0.88rem; line-height: 1.3; margin-bottom: 0.2rem; }
.card-meta { font-size: 0.75rem; color: var(--dim); line-height: 1.4; }
.card-score { font-size: 0.72rem; color: var(--yellow); margin-top: 0.2rem; }

.empty { text-align: center; padding: 4rem 2rem; color: var(--dim); }
.empty-icon { font-size: 3rem; margin-bottom: 1rem; }

.fab {
  position: fixed; bottom: calc(1.5rem + env(safe-area-inset-bottom)); right: 1.2rem;
  width: 52px; height: 52px; border-radius: 50%; background: var(--accent);
  border: none; color: white; font-size: 1.6rem; cursor: pointer; z-index: 50;
  box-shadow: 0 4px 16px rgba(74,158,255,0.4);
  display: flex; align-items: center; justify-content: center; transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }

.overlay { position: fixed; inset: 0; background: rgba(5,10,20,0.88); z-index: 100; display: none; flex-direction: column; justify-content: flex-end; backdrop-filter: blur(6px); }
.overlay.open { display: flex; }
.sheet { background: var(--surface); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; max-height: 94vh; overflow-y: auto; padding: 0 1.1rem calc(1.5rem + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0.8rem auto 1rem; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.1rem; }
.sheet-title { font-size: 1.1rem; font-weight: 700; }
.sheet-header-btns { display: flex; gap: 0.5rem; align-items: center; }
.del-btn { background: rgba(255,90,90,0.1); border: 1px solid rgba(255,90,90,0.3); color: var(--red); padding: 0.3rem 0.75rem; border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: inherit; }
.close-x { background: var(--card); border: 1px solid var(--border); color: var(--dim); width: 30px; height: 30px; border-radius: 6px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.preview-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 0.75rem; display: none; }
.upload-zone { border: 2px dashed var(--border); border-radius: 8px; text-align: center; padding: 1.2rem; cursor: pointer; position: relative; transition: border-color 0.15s; margin-bottom: 0.75rem; }
.upload-zone:hover { border-color: var(--accent); }
.upload-zone input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.upload-zone-icon { font-size: 1.6rem; margin-bottom: 0.3rem; }
.upload-hint { font-size: 0.85rem; color: var(--dim); }

.analyze-btn { width: 100%; padding: 0.65rem; background: rgba(74,158,255,0.1); border: 1px solid rgba(74,158,255,0.35); color: var(--accent); font-size: 0.88rem; font-weight: 600; cursor: pointer; border-radius: 8px; margin-bottom: 0.75rem; font-family: inherit; display: none; transition: background 0.15s; }
.analyze-btn:hover { background: rgba(74,158,255,0.2); }
.analyze-btn:disabled { opacity: 0.4; }

.status-msg { text-align: center; font-size: 0.85rem; padding: 0.4rem; border-radius: 6px; display: none; margin-bottom: 0.5rem; }
.status-msg.loading { color: var(--accent); }
.status-msg.error { color: var(--red); background: rgba(255,90,90,0.1); }
.status-msg.success { color: var(--green); }

.sep { height: 1px; background: var(--border); margin: 0.9rem 0; }
.section-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.6rem; margin-top: 0.2rem; }

.field { margin-bottom: 0.75rem; }
.field label { display: block; font-size: 0.75rem; font-weight: 500; color: var(--dim); margin-bottom: 0.25rem; }
.field input, .field textarea {
  width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  color: var(--white); padding: 0.6rem 0.75rem; font-size: 0.95rem; outline: none;
  font-family: inherit; -webkit-appearance: none; appearance: none; transition: border-color 0.15s;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field input::placeholder, .field textarea::placeholder { color: var(--dim); opacity: 0.6; }
.field textarea { resize: none; height: 76px; }
input[type="date"] { color-scheme: dark; }
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; }

.score-label { font-size: 0.75rem; font-weight: 500; color: var(--dim); margin-bottom: 0.3rem; }
.score-row { display: flex; gap: 0.3rem; }
.score-pip { flex: 1; height: 34px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); font-size: 0.85rem; font-weight: 500; color: var(--dim); cursor: pointer; font-family: inherit; transition: all 0.15s; }
.score-pip:hover { border-color: var(--accent); color: var(--accent); }
.score-pip.on { background: var(--accent); border-color: var(--accent); color: white; }

.save-btn { width: 100%; padding: 0.85rem; background: var(--accent); border: none; color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; border-radius: 10px; margin-top: 0.6rem; font-family: inherit; transition: background 0.15s; }
.save-btn:hover { background: var(--accent2); }
.save-btn:active { transform: scale(0.98); }
.save-btn:disabled { opacity: 0.5; }
.cancel-btn { width: 100%; padding: 0.7rem; margin-top: 0.5rem; background: none; border: 1px solid var(--border); color: var(--dim); font-size: 0.9rem; cursor: pointer; border-radius: 10px; font-family: inherit; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>🍷 Wine Journal</h1>
      <div class="header-sub" id="countLabel">Your personal cellar diary</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="exportCSV()" title="Export to Excel">📊</button>
      <button class="icon-btn" id="viewToggleBtn" onclick="toggleView()">☰</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="Search wine, producer, region…" oninput="onSearch()" />
  </div>
  <div class="tabs">
    <div class="tab active" id="tabAll"    onclick="filterTab('all')">All</div>
    <div class="tab"        id="tabFrance" onclick="filterTab('France')">France</div>
    <div class="tab"        id="tabItaly"  onclick="filterTab('Italy')">Italy</div>
    <div class="tab"        id="tabOther"  onclick="filterTab('other')">Other</div>
  </div>
</div>

<div class="content">
  <div id="wineContainer"></div>
  <div id="emptyMsg" class="empty" style="display:none">
    <div class="empty-icon">🍷</div>
    <p>No wines yet.<br>Tap + to log your first bottle.</p>
  </div>
</div>

<button class="fab" onclick="openAdd()">+</button>

<div class="overlay" id="overlay" onclick="overlayBgClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheetTitle">Log a Wine</div>
      <div class="sheet-header-btns">
        <button class="del-btn" id="delBtn" style="display:none" onclick="deleteWine()">🗑 Delete</button>
        <button class="close-x" onclick="closeSheet()">✕</button>
      </div>
    </div>

    <input type="hidden" id="editId" />
    <img id="previewImg" class="preview-img" />
    <div class="upload-zone">
      <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFile(event)" />
      <div class="upload-zone-icon">📷</div>
      <div class="upload-hint" id="uploadHint">Tap to photograph the label</div>
    </div>
    <button class="analyze-btn" id="analyzeBtn" onclick="analyzeLabel()" disabled>✦ Read Label with AI</button>
    <div class="status-msg" id="statusMsg"></div>

    <div class="sep"></div>

    <div class="section-label">Wine Info</div>
    <div class="field"><label>Wine Name *</label><input id="fName" placeholder="e.g. Montrachet" /></div>
    <div class="field"><label>Producer / Domaine</label><input id="fProducer" placeholder="e.g. Bachelet-Monnot" /></div>
    <div class="field"><label>Grape Variety</label><input id="fGrape" placeholder="e.g. Chardonnay" /></div>

    <div class="section-label" style="margin-top:0.3rem">Location</div>
    <div class="row3">
      <div class="field"><label>Country</label><input id="fCountry" placeholder="France" /></div>
      <div class="field"><label>Region</label><input id="fRegion" placeholder="Burgundy" /></div>
      <div class="field"><label>Sub-Region</label><input id="fSubregion" placeholder="Chassagne-Montrachet" /></div>
    </div>

    <div class="section-label" style="margin-top:0.3rem">Details</div>
    <div class="row3">
      <div class="field"><label>Vintage</label><input id="fVintage" placeholder="2021" inputmode="numeric" /></div>
      <div class="field"><label>Price</label><input id="fPrice" type="number" placeholder="0.00" inputmode="decimal" /></div>
      <div class="field"><label>Date Consumed</label><input type="date" id="fDate" /></div>
    </div>

    <div style="margin-bottom:0.8rem">
      <div class="score-label" id="scoreLabel">Score (1–10)</div>
      <div class="score-row" id="scoreRow"></div>
    </div>

    <div class="section-label">Tasting Notes</div>
    <div class="field">
      <textarea id="fComment" placeholder="Aroma, taste, finish, food pairing, occasion…"></textarea>
    </div>

    <button class="save-btn" id="saveBtn" onclick="saveWine()">Save to Cellar</button>
    <button class="cancel-btn" onclick="closeSheet()">Cancel</button>
  </div>
</div>

<script>
let wines = [], currentScore = 0, currentImageData = null;
let editingId = null, viewMode = 'list', activeTab = 'all', searchTimer = null;

document.addEventListener('DOMContentLoaded', () => {
  buildScore(); loadWines();
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
});

function buildScore() {
  const row = document.getElementById('scoreRow');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.type='button'; b.className='score-pip'; b.textContent=i; b.dataset.n=i;
    b.onclick = () => setScore(i); row.appendChild(b);
  }
}
function setScore(n) {
  currentScore = currentScore===n ? 0 : n;
  document.querySelectorAll('.score-pip').forEach(b => b.classList.toggle('on', +b.dataset.n===currentScore));
  document.getElementById('scoreLabel').textContent = currentScore>0 ? `Score — ${currentScore}/10` : 'Score (1–10)';
}

async function loadWines(q='') {
  try {
    const r = await fetch(q ? `/api/wines?q=${encodeURIComponent(q)}` : '/api/wines');
    const d = await r.json(); wines = Array.isArray(d) ? d : [];
  } catch { wines=[]; }
  render();
}

function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadWines(document.getElementById('searchInput').value.trim()), 350);
}

function filterTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById({all:'tabAll',France:'tabFrance',Italy:'tabItaly',other:'tabOther'}[tab]).classList.add('active');
  render();
}

function toggleView() {
  viewMode = viewMode==='list' ? 'grid' : 'list';
  document.getElementById('viewToggleBtn').textContent = viewMode==='list' ? '☰' : '⊞';
  render();
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function filteredWines() {
  if (activeTab==='all') return wines;
  if (activeTab==='other') return wines.filter(w => !['France','Italy'].includes(w.country||''));
  return wines.filter(w => (w.country||'')===activeTab);
}

function render() {
  const list = filteredWines();
  const container = document.getElementById('wineContainer');
  const empty = document.getElementById('emptyMsg');
  const n = wines.length;
  document.getElementById('countLabel').textContent = n===0 ? 'Your personal cellar diary' : `${n} bottle${n===1?'':'s'} in your cellar`;
  if (list.length===0) { container.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  if (viewMode==='list') {
    container.innerHTML = `<div class="wine-list">${list.map(w=>`
      <div class="wine-row" onclick="openEdit('${w.id}')">
        ${w.image_data ? `<img class="row-thumb" src="${w.image_data}" loading="lazy"/>` : `<div class="row-thumb-ph">🍷</div>`}
        <div class="row-info">
          <div class="row-name">${esc(w.name)}</div>
          <div class="row-meta">${[w.producer,[w.region,w.subregion].filter(Boolean).join(' · ')].filter(Boolean).map(esc).join(' — ')}</div>
        </div>
        <div class="row-right">
          <div class="row-vintage">${esc(w.vintage||'')}</div>
          ${w.score>0?`<div class="row-score">★ ${w.score}/10</div>`:''}
          ${w.price?`<div class="row-price">$${w.price}</div>`:''}
        </div>
      </div>`).join('')}</div>`;
  } else {
    container.innerHTML = `<div class="wine-grid">${list.map(w=>`
      <div class="wine-card" onclick="openEdit('${w.id}')">
        ${w.image_data?`<img class="card-img" src="${w.image_data}" loading="lazy"/>`:`<div class="card-img-ph">🍷</div>`}
        <div class="card-body">
          <div class="card-name">${esc(w.name)}</div>
          <div class="card-meta">${esc([w.producer,w.vintage].filter(Boolean).join(' · '))}</div>
          <div class="card-meta">${esc([w.region,w.country].filter(Boolean).join(', '))}</div>
          ${w.score>0?`<div class="card-score">★ ${w.score}/10</div>`:''}
        </div>
      </div>`).join('')}</div>`;
  }
}

function openAdd() {
  editingId=null; currentScore=0; currentImageData=null;
  document.getElementById('sheetTitle').textContent='Log a Wine';
  document.getElementById('delBtn').style.display='none';
  document.getElementById('saveBtn').textContent='Save to Cellar';
  clearForm();
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function openEdit(id) {
  const w=wines.find(x=>x.id===id); if(!w) return;
  editingId=id; currentScore=w.score||0; currentImageData=w.image_data||null;
  document.getElementById('sheetTitle').textContent='Edit Wine';
  document.getElementById('delBtn').style.display='block';
  document.getElementById('saveBtn').textContent='Save Changes';
  document.getElementById('fName').value=w.name||'';
  document.getElementById('fProducer').value=w.producer||'';
  document.getElementById('fGrape').value=w.grape||'';
  document.getElementById('fCountry').value=w.country||'';
  document.getElementById('fRegion').value=w.region||'';
  document.getElementById('fSubregion').value=w.subregion||'';
  document.getElementById('fVintage').value=w.vintage||'';
  document.getElementById('fPrice').value=w.price||'';
  document.getElementById('fDate').value=w.date||new Date().toISOString().split('T')[0];
  document.getElementById('fComment').value=w.comment||'';
  document.querySelectorAll('.score-pip').forEach(b=>b.classList.toggle('on',+b.dataset.n===currentScore));
  document.getElementById('scoreLabel').textContent=currentScore>0?`Score — ${currentScore}/10`:'Score (1–10)';
  const img=document.getElementById('previewImg');
  if(currentImageData){img.src=currentImageData;img.style.display='block';}else{img.style.display='none';}
  document.getElementById('uploadHint').textContent=currentImageData?'Tap to change photo':'Tap to add photo';
  const ab=document.getElementById('analyzeBtn');
  ab.style.display=currentImageData?'block':'none'; ab.disabled=false;
  setStatus('','');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('fileInput').value='';
}
function overlayBgClick(e){if(e.target===e.currentTarget)closeSheet();}

function clearForm() {
  ['fName','fProducer','fGrape','fCountry','fRegion','fSubregion','fVintage','fComment'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fPrice').value='';
  document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
  document.querySelectorAll('.score-pip').forEach(b=>b.classList.remove('on'));
  document.getElementById('scoreLabel').textContent='Score (1–10)';
  document.getElementById('previewImg').style.display='none';
  document.getElementById('uploadHint').textContent='Tap to photograph the label';
  document.getElementById('analyzeBtn').style.display='none';
  document.getElementById('analyzeBtn').disabled=true;
  setStatus('','');
}

function handleFile(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    currentImageData=ev.target.result;
    const img=document.getElementById('previewImg');
    img.src=currentImageData; img.style.display='block';
    document.getElementById('uploadHint').textContent='Tap to change photo';
    const btn=document.getElementById('analyzeBtn');
    btn.style.display='block'; btn.disabled=false;
  };
  reader.readAsDataURL(file);
}

function setStatus(msg,type){
  const el=document.getElementById('statusMsg');
  if(!msg){el.style.display='none';return;}
  el.style.display='block'; el.className=`status-msg ${type}`; el.textContent=msg;
}

async function analyzeLabel() {
  const fi=document.getElementById('fileInput');
  if(!fi.files[0]&&!currentImageData) return;
  setStatus('Reading label…','loading');
  document.getElementById('analyzeBtn').disabled=true;
  try {
    let body;
    if(fi.files[0]){body=new FormData();body.append('image',fi.files[0]);}
    else{const res=await fetch(currentImageData);const blob=await res.blob();body=new FormData();body.append('image',blob,'wine.jpg');}
    const r=await fetch('/api/analyze',{method:'POST',body});
    const data=await r.json();
    if(!r.ok||data.error){setStatus('Could not read label: '+(data.error||'Unknown error'),'error');}
    else {
      if(data.name)      document.getElementById('fName').value=data.name;
      if(data.producer)  document.getElementById('fProducer').value=data.producer;
      if(data.grape)     document.getElementById('fGrape').value=data.grape;
      if(data.vintage)   document.getElementById('fVintage').value=data.vintage;
      if(data.country)   document.getElementById('fCountry').value=data.country;
      if(data.region)    document.getElementById('fRegion').value=data.region;
      if(data.subregion) document.getElementById('fSubregion').value=data.subregion;
      setStatus('✓ Label read! Review and adjust if needed.','success');
    }
  } catch(e){setStatus('Error: '+e.message,'error');}
  document.getElementById('analyzeBtn').disabled=false;
}

async function saveWine() {
  const name=document.getElementById('fName').value.trim();
  if(!name){alert('Wine name is required.');return;}
  const wine={
    name, producer:document.getElementById('fProducer').value.trim(),
    grape:document.getElementById('fGrape').value.trim(),
    country:document.getElementById('fCountry').value.trim(),
    region:document.getElementById('fRegion').value.trim(),
    subregion:document.getElementById('fSubregion').value.trim(),
    vintage:document.getElementById('fVintage').value.trim(),
    price:parseFloat(document.getElementById('fPrice').value)||null,
    date:document.getElementById('fDate').value,
    comment:document.getElementById('fComment').value.trim(),
    score:currentScore, image_data:currentImageData,
  };
  const btn=document.getElementById('saveBtn');
  btn.disabled=true; btn.textContent='Saving…';
  try {
    if(editingId){
      const r=await fetch(`/api/wines/${editingId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(wine)});
      if(!r.ok) throw new Error((await r.json()).error||'Update failed');
      const idx=wines.findIndex(w=>w.id===editingId);
      if(idx>=0) wines[idx]={...wines[idx],...wine};
    } else {
      const r=await fetch('/api/wines',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(wine)});
      if(!r.ok) throw new Error((await r.json()).error||'Save failed');
      wines.unshift(await r.json());
    }
    render(); closeSheet();
  } catch(e){alert('Error: '+e.message);}
  btn.disabled=false; btn.textContent=editingId?'Save Changes':'Save to Cellar';
}

async function deleteWine() {
  if(!editingId||!confirm('Remove this wine?')) return;
  await fetch(`/api/wines/${editingId}`,{method:'DELETE'});
  wines=wines.filter(w=>w.id!==editingId);
  render(); closeSheet();
}

function exportCSV(){window.location.href='/api/export';}
</script>
