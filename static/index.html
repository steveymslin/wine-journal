<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cave à Vin">
<title>Cave à Vin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --burgundy: #6B1A2C;
  --gold: #C9A84C;
  --cream: #F5EFE0;
  --dark: #1A0A0E;
  --panel: #1E0A12;
  --modal: #250D16;
  --muted: #8B7355;
  --green: #7dcea0;
  --red: #e74c3c;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--dark);
  color: var(--cream);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── Header ── */
.header {
  text-align: center;
  padding: 2.5rem 1rem 1.5rem;
  position: sticky; top: 0;
  background: var(--dark);
  z-index: 10;
  border-bottom: 1px solid rgba(201,168,76,0.12);
}
.header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gold); letter-spacing: 0.04em; }
.header p { font-size: 0.9rem; color: var(--muted); font-style: italic; }

/* ── FAB (floating add button) ── */
.fab {
  position: fixed; bottom: calc(1.5rem + env(safe-area-inset-bottom)); right: 1.5rem;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--burgundy); border: 2px solid rgba(201,168,76,0.5);
  color: var(--gold); font-size: 1.8rem; line-height: 1;
  cursor: pointer; z-index: 50;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s, background 0.2s;
}
.fab:active { transform: scale(0.92); background: var(--gold); color: var(--dark); }

/* ── Wine grid ── */
.wines { padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
.wine-card {
  background: var(--panel); border: 1px solid rgba(201,168,76,0.1);
  border-radius: 2px; overflow: hidden; position: relative;
  transition: border-color 0.2s;
}
.card-img { width: 100%; height: 130px; object-fit: cover; display: block; }
.card-body { padding: 0.75rem; }
.card-name { font-family: 'Playfair Display', serif; font-size: 0.95rem; line-height: 1.3; margin-bottom: 0.25rem; }
.card-meta { font-size: 0.8rem; color: var(--muted); font-style: italic; line-height: 1.4; }
.card-date { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(201,168,76,0.5); margin-top: 0.3rem; }
.card-comment { font-size: 0.8rem; color: rgba(245,239,224,0.55); font-style: italic; margin-top: 0.4rem; border-left: 2px solid rgba(201,168,76,0.2); padding-left: 0.5rem; line-height: 1.4; }
.score-badge {
  position: absolute; top: 0.5rem; right: 0.5rem;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(107,26,44,0.9); border: 1px solid rgba(201,168,76,0.5);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif; font-size: 0.8rem; color: var(--gold);
  backdrop-filter: blur(4px);
}
.del-btn {
  position: absolute; top: 0.5rem; left: 0.5rem;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(0,0,0,0.5); border: none;
  color: rgba(255,255,255,0.4); font-size: 0.75rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.del-btn:active { color: var(--red); }

.empty { text-align: center; padding: 5rem 2rem; color: var(--muted); font-style: italic; }

/* ── Modal / Sheet ── */
.overlay {
  position: fixed; inset: 0; background: rgba(5,1,3,0.92);
  z-index: 100; display: none; flex-direction: column;
  justify-content: flex-end;
  backdrop-filter: blur(6px);
}
.overlay.open { display: flex; }
.sheet {
  background: var(--modal);
  border-top: 1px solid rgba(201,168,76,0.25);
  border-radius: 16px 16px 0 0;
  max-height: 92vh;
  overflow-y: auto;
  padding: 0 1.2rem calc(1.5rem + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}
.sheet-handle { width: 36px; height: 4px; background: rgba(201,168,76,0.3); border-radius: 2px; margin: 0.8rem auto 1.2rem; }
.sheet-title { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.4rem; margin-bottom: 1.2rem; }

/* Photo */
.photo-area { margin-bottom: 1rem; }
.preview-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 4px; margin-bottom: 0.8rem; display: none; }
.upload-zone {
  border: 2px dashed rgba(201,168,76,0.3); border-radius: 6px;
  text-align: center; padding: 1.5rem 1rem; position: relative; cursor: pointer;
}
.upload-zone input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.upload-icon { font-size: 2rem; margin-bottom: 0.3rem; }
.upload-hint { color: var(--muted); font-style: italic; font-size: 0.9rem; }

.analyze-btn {
  width: 100%; padding: 0.75rem;
  background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.4);
  color: var(--gold); font-family: 'Cormorant Garamond', serif; font-size: 1rem;
  cursor: pointer; letter-spacing: 0.07em; text-transform: uppercase;
  border-radius: 4px; margin-bottom: 0.8rem; transition: background 0.2s;
  display: none;
}
.analyze-btn:active { background: rgba(201,168,76,0.25); }
.analyze-btn:disabled { opacity: 0.4; }

.status-msg { text-align: center; font-style: italic; font-size: 0.9rem; padding: 0.3rem 0 0.5rem; display: none; }
.status-msg.loading { color: var(--gold); }
.status-msg.error { color: var(--red); }
.status-msg.success { color: var(--green); }

.sep { height: 1px; background: rgba(201,168,76,0.1); margin: 1rem 0; }

/* Form fields */
.field { margin-bottom: 0.9rem; }
.field label { display: block; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.28rem; }
.field input, .field textarea {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(201,168,76,0.2); border-radius: 4px;
  color: var(--cream); padding: 0.65rem 0.8rem;
  font-family: 'Cormorant Garamond', serif; font-size: 1.05rem;
  outline: none; -webkit-appearance: none; appearance: none;
}
.field input:focus, .field textarea:focus { border-color: rgba(201,168,76,0.6); }
.field textarea { resize: none; height: 80px; }
input[type="date"] { color-scheme: dark; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }

/* Score */
.score-label { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
.score-row { display: flex; gap: 0.28rem; }
.score-pip {
  flex: 1; height: 34px; border-radius: 4px;
  border: 1px solid rgba(201,168,76,0.25); background: none;
  font-family: 'Cormorant Garamond', serif; font-size: 0.9rem; color: var(--muted);
  cursor: pointer; transition: all 0.15s;
}
.score-pip.on { background: var(--burgundy); border-color: var(--gold); color: var(--gold); }

.save-btn {
  width: 100%; padding: 0.9rem;
  background: var(--burgundy); border: 1px solid rgba(201,168,76,0.4);
  color: var(--cream); font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; cursor: pointer; letter-spacing: 0.09em;
  text-transform: uppercase; border-radius: 4px; margin-top: 0.6rem;
  transition: background 0.2s;
}
.save-btn:active { background: var(--gold); color: var(--dark); }
.save-btn:disabled { opacity: 0.5; }

.cancel-btn {
  width: 100%; padding: 0.7rem; margin-top: 0.6rem;
  background: none; border: 1px solid rgba(201,168,76,0.15);
  color: var(--muted); font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; cursor: pointer; letter-spacing: 0.06em;
  text-transform: uppercase; border-radius: 4px;
}
</style>
</head>
<body>

<div class="header">
  <h1>Cave à Vin</h1>
  <p id="countLabel">Your personal wine diary</p>
</div>

<div id="wineGrid" class="wines"></div>
<div id="emptyMsg" class="empty" style="display:none">
  🍷<br><br>Your cellar is empty.<br>Tap + to log your first wine.
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- Bottom Sheet Modal -->
<div class="overlay" id="overlay" onclick="overlayBgClick(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Log a Wine</div>

    <div class="photo-area">
      <img id="previewImg" class="preview-img" />
      <div class="upload-zone">
        <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFile(event)" />
        <div class="upload-icon">📷</div>
        <div class="upload-hint" id="uploadHint">Tap to photograph the label</div>
      </div>
    </div>

    <button class="analyze-btn" id="analyzeBtn" onclick="analyzeLabel()" disabled>
      ✦ Read Label with AI
    </button>
    <div class="status-msg" id="statusMsg"></div>

    <div class="sep"></div>

    <div class="field"><label>Wine Name *</label><input id="fName" placeholder="e.g. Plein Sud" /></div>
    <div class="field"><label>Producer</label><input id="fProducer" placeholder="e.g. Jean François Ganevat" /></div>
    <div class="field"><label>Grape Variety</label><input id="fGrape" placeholder="e.g. Chardonnay" /></div>
    <div class="row2">
      <div class="field"><label>Vintage</label><input id="fVintage" placeholder="e.g. 2021" inputmode="numeric" /></div>
      <div class="field"><label>Region</label><input id="fRegion" placeholder="e.g. Jura, France" /></div>
    </div>
    <div class="field"><label>Date Consumed</label><input type="date" id="fDate" /></div>
    <div style="margin-bottom:0.9rem">
      <div class="score-label" id="scoreLabel">Score (1–10)</div>
      <div class="score-row" id="scoreRow"></div>
    </div>
    <div class="field"><label>Tasting Notes</label><textarea id="fComment" placeholder="Your impressions, food pairing, occasion…"></textarea></div>

    <button class="save-btn" id="saveBtn" onclick="saveWine()">Save to Cellar</button>
    <button class="cancel-btn" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
let wines = [];
let currentScore = 0;
let currentImageData = null;

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  buildScore();
  loadWines();
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
});

// ── Score ──
function buildScore() {
  const row = document.getElementById('scoreRow');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'score-pip';
    b.textContent = i;
    b.dataset.n = i;
    b.onclick = () => setScore(i);
    row.appendChild(b);
  }
}
function setScore(n) {
  currentScore = currentScore === n ? 0 : n;
  document.querySelectorAll('.score-pip').forEach(b =>
    b.classList.toggle('on', +b.dataset.n === currentScore));
  document.getElementById('scoreLabel').textContent =
    currentScore > 0 ? `Score · ${currentScore}/10` : 'Score (1–10)';
}

// ── Load & render ──
async function loadWines() {
  try {
    const r = await fetch('/api/wines');
    wines = await r.json();
    if (!Array.isArray(wines)) wines = [];
  } catch { wines = []; }
  render();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const grid = document.getElementById('wineGrid');
  const empty = document.getElementById('emptyMsg');
  const count = document.getElementById('countLabel');

  const n = wines.length;
  count.textContent = n === 0 ? 'Your personal wine diary' : `${n} bottle${n===1?'':'s'} logged`;

  if (n === 0) { grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = wines.map(w => `
    <div class="wine-card">
      ${w.score > 0 ? `<div class="score-badge">${w.score}</div>` : ''}
      <button class="del-btn" onclick="deleteWine('${w.id}')">✕</button>
      ${w.image_data ? `<img class="card-img" src="${w.image_data}" loading="lazy" />` : ''}
      <div class="card-body">
        <div class="card-name">${esc(w.name)}</div>
        <div class="card-meta">${[w.producer,w.grape,w.vintage,w.region].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="card-date">${esc(w.date||'')}</div>
        ${w.comment ? `<div class="card-comment">"${esc(w.comment)}"</div>` : ''}
      </div>
    </div>
  `).join('');
}

// ── Modal ──
function openModal() {
  currentScore = 0; currentImageData = null;
  ['fName','fProducer','fGrape','fVintage','fRegion','fComment'].forEach(id => document.getElementById(id).value='');
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
  document.querySelectorAll('.score-pip').forEach(b => b.classList.remove('on'));
  document.getElementById('scoreLabel').textContent = 'Score (1–10)';
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('uploadHint').textContent = 'Tap to photograph the label';
  document.getElementById('analyzeBtn').style.display = 'none';
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('fileInput').value = '';
  setStatus('','');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function overlayBgClick(e) { if (e.target === e.currentTarget) closeModal(); }

// ── File / photo ──
function handleFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentImageData = ev.target.result;
    const img = document.getElementById('previewImg');
    img.src = currentImageData; img.style.display = 'block';
    document.getElementById('uploadHint').textContent = 'Tap to change photo';
    const btn = document.getElementById('analyzeBtn');
    btn.style.display = 'block'; btn.disabled = false;
  };
  reader.readAsDataURL(file);
}

// ── Analyze ──
function setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  if (!msg) { el.style.display='none'; return; }
  el.style.display='block'; el.className=`status-msg ${type}`; el.textContent=msg;
}

async function analyzeLabel() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files[0]) return;

  setStatus('Reading label…', 'loading');
  document.getElementById('analyzeBtn').disabled = true;

  const formData = new FormData();
  formData.append('image', fileInput.files[0]);

  try {
    const r = await fetch('/api/analyze', { method:'POST', body:formData });
    const data = await r.json();
    if (!r.ok || data.error) {
      setStatus('Could not read label: ' + (data.error||'Unknown error'), 'error');
    } else {
      if (data.name)     document.getElementById('fName').value = data.name;
      if (data.producer) document.getElementById('fProducer').value = data.producer;
      if (data.grape)    document.getElementById('fGrape').value = data.grape;
      if (data.vintage)  document.getElementById('fVintage').value = data.vintage;
      if (data.region || data.country)
        document.getElementById('fRegion').value = [data.region, data.country].filter(Boolean).join(', ');
      setStatus('✓ Label read! Check and adjust if needed.', 'success');
    }
  } catch(e) {
    setStatus('Network error: ' + e.message, 'error');
  }
  document.getElementById('analyzeBtn').disabled = false;
}

// ── Save ──
async function saveWine() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('Please enter a wine name.'); return; }

  const wine = {
    name,
    producer: document.getElementById('fProducer').value.trim(),
    grape:    document.getElementById('fGrape').value.trim(),
    vintage:  document.getElementById('fVintage').value.trim(),
    region:   document.getElementById('fRegion').value.trim(),
    date:     document.getElementById('fDate').value,
    comment:  document.getElementById('fComment').value.trim(),
    score:    currentScore,
    image_data: currentImageData,
  };

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    const r = await fetch('/api/wines', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(wine)
    });
    const saved = await r.json();
    if (!r.ok) throw new Error(saved.error || 'Save failed');
    wines.unshift(saved);
    render();
    closeModal();
  } catch(e) { alert('Save failed: ' + e.message); }

  btn.disabled = false; btn.textContent = 'Save to Cellar';
}

// ── Delete ──
async function deleteWine(id) {
  if (!confirm('Remove this wine from your journal?')) return;
  await fetch(`/api/wines/${id}`, {method:'DELETE'});
  wines = wines.filter(w => w.id !== id);
  render();
}
</script>
</body>
</html>
